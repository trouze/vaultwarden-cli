name: Build fork prerelease artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (source and artifacts must match)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace
      - name: Build and smoke test
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/vaultwarden-cli
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            ./target/${{ matrix.target }}/release/vaultwarden-cli --version
          fi
      - name: Archive with license and checksum
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vaultwarden-cli LICENSE dist/
          tar -czf vaultwarden-cli-${{ matrix.target }}.tar.gz -C dist vaultwarden-cli LICENSE
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            sha256sum vaultwarden-cli-${{ matrix.target }}.tar.gz > SHA256SUMS-linux.txt
          else
            shasum -a 256 vaultwarden-cli-${{ matrix.target }}.tar.gz > SHA256SUMS-${{ matrix.target }}.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-cli-${{ matrix.target }}
          path: |
            vaultwarden-cli-${{ matrix.target }}.tar.gz
            SHA256SUMS-*.txt
